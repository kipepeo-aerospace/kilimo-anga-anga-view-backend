name: Trigger auto deployment for kilimoanga-angaview-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/kilimoanga-angaview-backend-AutoDeployTrigger-bfe494d9-9e64-4aee-9f27-aa918d14b9c3.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.KILIMOANGAANGAVIEWBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.KILIMOANGAANGAVIEWBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.KILIMOANGAANGAVIEWBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: kilimoangaacr2025-cghgg5d0etc3fkdp.azurecr.io
          registryUsername: ${{ secrets.KILIMOANGAANGAVIEWBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.KILIMOANGAANGAVIEWBACKEND_REGISTRY_PASSWORD }}
          containerAppName: kilimoanga-angaview-backend
          resourceGroup: KilimoAnga
          imageToBuild: kilimoangaacr2025-cghgg5d0etc3fkdp.azurecr.io/kilimoanga-angaview-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


